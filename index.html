<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Finance & Smart Budget Tracker</title>
    <meta name="description" content="Track Smarter. Spend Better. Save More. Professional full-stack financial analytics, budget management, overspending alerts, and multi-workspace accounting." />
    <meta property="og:title" content="Personal Finance & Smart Budget Tracker" />
    <meta property="og:description" content="Track Smarter. Spend Better. Save More. Professional full-stack financial analytics, budget management, overspending alerts, and multi-workspace accounting." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Gracefully prevent unhandled promise rejections from Vite WebSocket in restricted iframe previews
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (String(event.reason).includes('WebSocket') || event.reason.message?.includes('WebSocket'))) {
          event.preventDefault();
        }
      });

      // Instantly restore selected financial theme from localStorage before render
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme_mode') || 'light';
          var isDark = savedTheme === 'dark' || savedTheme === 'ocean' || savedTheme === 'forest';
          var root = document.documentElement;
          root.classList.remove('theme-light', 'theme-dark', 'theme-ocean', 'theme-forest', 'theme-warm', 'dark');
          root.classList.add('theme-' + savedTheme);
          root.setAttribute('data-theme', savedTheme);
          if (isDark) {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.style.colorScheme = 'light';
          }
          var savedAccent = localStorage.getItem('theme_accent');
          if (savedAccent) {
            root.style.setProperty('--accent-color', savedAccent);
            root.style.setProperty('--theme-accent', savedAccent);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
